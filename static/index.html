<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SocialLab compara compatibilidad, bienestar, equidad y equilibrio de Nash en grupos pequeños."
    />
    <title>SocialLab · Simulador social funcional</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="Ir al inicio de SocialLab">
        <span class="brand-mark">SL</span>
        <strong>SocialLab</strong>
      </a>
      <span class="tech-badge">Núcleo Haskell</span>
    </header>

    <main id="inicio">
      <div id="status" class="status" role="status" aria-live="polite">
        Cargando…
      </div>

      <section class="workspace" aria-label="Simulador">
        <aside class="editor-panel panel">
          <div class="section-heading">
            <h2>Preferencias</h2>
            <button id="reset-button" class="button button-secondary" type="button">Restablecer</button>
          </div>

          <label class="field-label" for="scenario-mode">Formación</label>
          <select id="scenario-mode" class="text-input"></select>

          <label class="field-label" for="scenario-title">Escenario</label>
          <input id="scenario-title" class="text-input" type="text" maxlength="80" />

          <label class="field-label" for="person-select">Persona a editar</label>
          <select id="person-select" class="text-input"></select>

          <div id="person-summary" class="person-summary"></div>
          <div id="preferences-editor" class="preferences-editor"></div>

          <label class="field-label" for="outside-option">Utilidad de reserva</label>
          <input id="outside-option" class="number-input" type="number" min="0" max="100" step="1" />

          <button id="analyze-button" class="button button-primary" type="button">
            Recalcular escenario
          </button>
        </aside>

        <section class="results-column" aria-label="Resultados">
          <div id="summary-cards" class="summary-grid"></div>

          <section class="panel network-panel">
            <div class="section-heading network-heading">
              <h2>Red de compatibilidad</h2>
              <div class="network-tabs" role="group" aria-label="Asignación mostrada">
                <button class="network-tab is-active" type="button" data-network-mode="social">Óptimo</button>
                <button class="network-tab" type="button" data-network-mode="fair">Equidad</button>
                <button id="stability-tab" class="network-tab" type="button" data-network-mode="stable">Nash</button>
              </div>
            </div>
            <div class="network-layout">
              <svg
                id="network-graph"
                class="network-graph"
                viewBox="0 0 720 460"
                role="img"
                aria-label="Red de compatibilidad entre personas"
              ></svg>
              <div id="network-details" class="network-details"></div>
            </div>
          </section>

          <section class="panel">
            <div class="section-heading">
              <h2>Asignaciones</h2>
            </div>
            <div id="assignment-comparison" class="assignment-grid"></div>
          </section>

          <section class="panel">
            <div class="section-heading">
              <h2>Matriz de afinidad</h2>
            </div>
            <div id="affinity-matrix" class="table-scroll"></div>
          </section>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js?v=3"></script>
  </body>
</html>
